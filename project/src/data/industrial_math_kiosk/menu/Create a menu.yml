info:
  name: Create a menu
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/api/menus
  body:
    type: json
    data: |-
      {
        "name": {
          "kor":"테스트메뉴",
          "eng":"TestMenu",
          "esp":"TestoMenú"
        },
        "price": 7200,
        "category": "Coffee",
        "img": "https://joyfoodsunshine.com/wp-content/uploads/2019/01/strawberry-banana-smoothie-recipe-1x1-1.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
