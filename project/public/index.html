<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meri Latte</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="hero-layout">
      <section class="hero-copy">
        <div class="brand-copy-line">
          <span class="brand-blue">Meri Latte</span>
          <br />
          <span>당신을 위한 단 한 잔의 커피</span>
        </div>
        <div class="brand-footer-line">
          <iconify-icon icon="simple-icons:instagram" width="36"></iconify-icon>
          <span> meri_latte_ </span>
        </div>
      </section>
      <section class="hero-kiosk">
        <div class="kiosk-shell">
          <div class="kiosk-screen">
            <div class="kiosk-screen-safe">
              <div>
                <div class="welcome-title">반가워요</div>
                <div class="welcome-title">주문을 시작할게요</div>
              </div>
              <div id="main-selector">
                <div class="box-selector">
                  <iconify-icon icon="noto:cup-with-straw" width="60"></iconify-icon>
                  <div>먹고가요</div>
                </div>
                <div class="box-selector">
                  <iconify-icon icon="noto:shopping-bags" width="60"></iconify-icon>
                  <div>포장할게요</div>
                </div>
              </div>
              <div id="languages">
                <div id="button-wrapper">
                  <div id="button-korean" class="lang-buttons" data-lang="kor">
                    <iconify-icon icon="flag:kr-4x3" width="40"></iconify-icon>
                  </div>
                  <div id="button-english" class="lang-buttons" data-lang="eng">
                    <iconify-icon icon="flag:us-4x3" width="40"></iconify-icon>
                  </div>
                  <div id="button-spanish" class="lang-buttons" data-lang="esp">
                    <iconify-icon icon="flag:es-4x3" width="40"></iconify-icon>
                  </div>
                </div>
              </div>
              <button id="admin-button" type="button" aria-label="관리자 메뉴 열기">
                <iconify-icon icon="solar:settings-linear" width="22"></iconify-icon>
              </button>
            </div>

            <!-- admin modal -->
            <div id="admin-modal">
              <div id="modal-content">
                <div id="modal-title">
                  <div>어서오세요!</div>
                  <div>관리를 시작할까요?</div>
                </div>
                <div id="modal-form">
                  <form id="admin-form" action="">
                    <div>
                      <!-- <label for="id">ID</label> -->
                      <input id="form-input-id" type="text" name="id" placeholder="아이디" />
                    </div>
                    <div>
                      <!-- <label for="password">PW</label> -->
                      <input
                        id="form-input-pw"
                        type="password"
                        name="password"
                        placeholder="비밀번호"
                      />
                    </div>
                    <div class="button-wrapper">
                      <button type="cancel" class="cancel" id="cancel">
                        <div>
                          <iconify-icon
                            icon="material-symbols-light:cancel"
                            width="28"
                            style="color: white"
                          />
                        </div>
                        <div>홈 화면으로</div>
                      </button>
                      <button type="submit" id="submit" class="submit">
                        <div>
                          <iconify-icon
                            icon="material-symbols-light:exit-to-app-rounded"
                            width="28"
                            style="color: white"
                          />
                        </div>
                        <div>로그인하기</div>
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
