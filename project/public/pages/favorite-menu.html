<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAVORITE MENU ADMIN</title>
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../index.css" />
    <script type="module" src="../js/admin-common.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
  </head>
  <body data-admin-page="favorite-menu">
    <section class="hero-tablet">
      <div class="tablet-shell">
        <div class="tablet-screen">
          <header>
            <div class="header-left">
              <iconify-icon icon="ci:hamburger-lg" width="32"></iconify-icon>
            </div>

            <div class="header-title">즐겨찾기 관리 | 설정</div>

            <div class="header-right">
              <span><i class="fa-solid fa-shield-halved"></i>안전하게 보호중</span>
              <i class="fa-solid fa-bell"></i>
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
          </header>
          <section class="main">
            <section class="left-sidebar">
              <div class="sidebar-group">
                <div class="sidebar-group-title">메뉴</div>
                <a class="sidebar-group-content" data-nav-page="menu-management" href="./admin.html"
                  >메뉴 관리</a
                >
                <a
                  class="sidebar-group-content"
                  data-nav-page="popular-menu"
                  href="./popular-menu.html"
                  >인기메뉴 관리</a
                >
                <a
                  class="sidebar-group-content"
                  data-nav-page="favorite-menu"
                  href="./favorite-menu.html"
                  >즐겨찾기 관리</a
                >
                <div class="sidebar-group-content">카테고리 설정(준비중)</div>
              </div>
              <div class="sidebar-group">
                <div class="sidebar-group-title">고객·쿠폰·적립</div>
                <div class="sidebar-group-content">고객 분석(준비중)</div>
                <div class="sidebar-group-content">쿠폰 자동 발송(준비중)</div>
                <div class="sidebar-group-content">쿠폰 수동 발송(준비중)</div>
                <div class="sidebar-group-content">포인트·스탬프(준비중)</div>
              </div>
            </section>
            <section class="body">
              <div class="favorite-management">
                <div class="menu-eyebrow">키오스크 홈 화면에 노출할 즐겨찾기 메뉴를 관리합니다</div>
                <div class="menu-title">
                  <span>
                    <i class="fa-solid fa-star"></i>
                    즐겨찾기 관리
                  </span>
                </div>
                <div class="analytics-panel favorite-ready-panel">
                  <div class="panel-heading">
                    <div>
                      <div class="panel-kicker">로컬 저장 방식 예정</div>
                      <h2>즐겨찾기 설정 화면 준비중</h2>
                    </div>
                  </div>
                  <p class="favorite-ready-text">
                    다음 단계에서 모든 메뉴를 불러와 즐겨찾기를 선택하고, 브라우저 로컬
                    스토리지에 저장하도록 연결합니다.
                  </p>
                </div>
              </div>
            </section>
          </section>

          <!-- touch mockup cursor -->
          <div id="cursor" class="cursor"></div>
        </div>
      </div>
    </section>
  </body>
</html>
