<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meri Latte</title>
    <link rel="stylesheet" href="../index.css" />
    <link rel="stylesheet" href="../css/order.css" />
    <script type="module" src="../js/order.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
    <!-- <script src="../index.js"></script> -->
    <!-- there is no need to load index.js -->
    <!-- ...maybe -->
  </head>
  <body>
    <div class="kiosk-shell">
      <div class="kiosk-screen">
        <header>
          <div>
            <iconify-icon id="backButton" icon="ic:baseline-arrow-back" width="28"></iconify-icon>
          </div>
          <div>
            <div id="lang-text"></div>
            <div id="to-first">처음 화면으로</div>
          </div>
        </header>
        <nav id="categories"></nav>
        <main id="menu-scroll-area"></main>
        <button
          id="cart-summary-bar"
          class="cart-summary-bar"
          type="button"
          aria-expanded="false"
          aria-controls="cart-bottom-sheet"
          hidden
        >
          <span class="cart-summary-main">
            <span aria-hidden="true">🛒</span>
            <strong id="cart-summary-count">0개 메뉴</strong>
            <span aria-hidden="true">·</span>
            <strong id="cart-summary-total">₩0</strong>
          </span>
          <span class="cart-summary-action">주문내역 보기</span>
        </button>
        <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
        <section
          id="cart-bottom-sheet"
          class="cart-bottom-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cart-sheet-title"
          hidden
        >
          <div class="sheet-handle" aria-hidden="true"></div>
          <header class="sheet-header">
            <h2 id="cart-sheet-title">주문 내역</h2>
            <button id="cart-sheet-close" class="sheet-close-button" type="button">닫기</button>
          </header>
          <div id="cart-list" class="cart-list"></div>
          <footer class="cart-sheet-footer">
            <div class="cart-total-row">
              <span>총 결제금액</span>
              <strong id="cart-sheet-total">₩0</strong>
            </div>
            <div class="order-btn-group">
              <button id="order-clear-button" class="order-clear-button" type="button">
                장바구니 비우기
              </button>
              <button id="order-button" class="order-button" type="button">주문하기</button>
            </div>
          </footer>
        </section>
      </div>
    </div>
  </body>
</html>
